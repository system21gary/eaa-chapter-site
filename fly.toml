# fly.toml app configuration file generated for eaa-chapter-site-lfhcfw on 2026-10-09T19:31:46Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'eaa-chapter-site-lfhcfw'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[deploy]
  release_command = 'npm run seed'
  strategy = 'rolling'
